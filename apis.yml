aid: system-initiative
name: System Initiative
description: >-
  System Initiative is an AI-native infrastructure automation platform. It
  builds an interactive digital twin of your cloud infrastructure — modeling
  every resource as a "component" inside reviewable "change sets" — so that
  engineers and AI agents can discover, simulate, and safely apply changes to
  production. It works alongside Terraform, Pulumi, and GitOps and can be
  adopted incrementally. System Initiative exposes a workspace-scoped Public
  API (the "luminork" server) with bearer-token auth, first-party Python and
  JavaScript/TypeScript SDKs, and a first-party Model Context Protocol (MCP)
  server so agents can model and automate infrastructure programmatically.
  Backed by Amplify Partners and Battery Ventures.
